# /etc/wan-notify.conf — uplink switch notifications (wan-notify), mode 0600.
#
# 1. Telegram -> @BotFather -> /newbot -> pick a name and a username ending
#    in "bot"; BotFather replies with a token like 123456789:AAH...
# 2. Open the new bot, press START, send it anything (e.g. "hi").
# 3. Ask the router which chat id to use:
#       /usr/sbin/wan-notify chatid
# 4. Put the two values below and test:
#       /usr/sbin/wan-notify test
#
# TG_CHAT may list several ids separated by commas (a group id is negative).

TG_TOKEN=''
TG_CHAT=''

# At most one switch message per this many seconds (a flapping ISP otherwise
# pings you every cycle). Held-back switches are counted in the next message.
MUTE=300
