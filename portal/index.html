<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0e1412">
<title>Guest Wi-Fi</title>
<script>location.replace('cgi-bin/splash' + location.search + location.hash);</script>
<style>
	:root { --ink:#0e1412; --paper:#eef1ec; --jade:#0e7a6e; --mint:#57d8be; --muted:#66736d; }
	* { box-sizing:border-box; }
	body {
		margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
		font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
		display:grid; place-items:center; padding:20px;
		background-image:radial-gradient(700px 420px at 10% -10%, rgba(87,216,190,.20), transparent 60%);
	}
	.box { display:flex; align-items:center; gap:14px; padding:20px 24px; background:#fff;
	       border:1px solid #e2e6de; border-radius:18px; box-shadow:0 20px 60px rgba(14,20,18,.10); }
	.mark { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; color:#eafff9;
	        background:linear-gradient(140deg,var(--jade),#149a88); flex:0 0 auto; }
	.mark svg { width:23px; height:23px; }
	h1 { margin:0; font-size:16px; letter-spacing:-.01em; }
	p { margin:2px 0 0; font-size:12.5px; color:var(--muted); }
	a { color:var(--jade); font-weight:600; text-decoration:none; }
	a:hover { text-decoration:underline; }
</style>
</head>
<body>
	<main class="box">
		<div class="mark" aria-hidden="true">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" focusable="false">
				<path d="M2.5 8.5a15 15 0 0 1 19 0"/>
				<path d="M5.8 12a10 10 0 0 1 12.4 0"/>
				<path d="M9.1 15.4a5 5 0 0 1 5.8 0"/>
				<circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/>
			</svg>
		</div>
		<div>
			<h1>Guest Wi-Fi</h1>
			<p>Loading the terms… <a href="cgi-bin/splash">Continue</a></p>
		</div>
	</main>
</body>
</html>
